# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
python:
  install:
    - requirements: help/requirements.txt

sphinx:
  configuration: help/conf.py

formats:
  - pdf
  - epub
languages:
  - index.md
  - fr